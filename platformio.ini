; LcdTester - tester ekranow LCD SPI dla ESP32 (domyslnie ESP32-C3)
;
; Wspolne ustawienia sa w sekcji [env], kazda wersja ESP32 to osobne srodowisko.
; Domyslne piny dla danego ukladu sa w src/BoardPins.h.

[platformio]
default_envs = esp32c3

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
; Automatycznie dekoduje stack trace po crashu
monitor_filters = esp32_exception_decoder
lib_deps =
    lovyan03/LovyanGFX@^1.2.7
; Bez OTA - cala przestrzen (3 MB) na aplikacje
board_build.partitions = huge_app.csv

[env:esp32c3]
board = esp32-c3-devkitm-1
board_build.flash_mode = dio
; Plytki z natywnym USB (np. ESP32-C3 Super Mini) - Serial przez USB:
;build_flags =
;    -DARDUINO_USB_MODE=1
;    -DARDUINO_USB_CDC_ON_BOOT=1

; Na przyszlosc - inne wersje ESP32 (odkomentuj w razie potrzeby)
;[env:esp32dev]
;board = esp32dev
;
;[env:esp32s3]
;board = esp32-s3-devkitc-1

; Port, jesli system go nie wykrywa
; upload_port = /dev/ttyACM0
; monitor_port = /dev/ttyACM0
